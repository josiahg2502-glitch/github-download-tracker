    let i = 0; pts.forEach((p, j) => { if (Math.abs(x(p.t) - mx) < Math.abs(x(pts[i].t) - mx)) i = j; });
    const px = x(pts[i].t);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    dots.forEach((d, k) => { d.setAttribute("cx", px); d.setAttribute("cy", y(series[k].values[i].v)); d.setAttribute("visibility", "visible"); });
    const rows = series.map(s => ({ s, v: s.values[i].v, ch: i ? s.values[i].v - s.values[i - 1].v : 0 })).sort((a, b) => b.v - a.v);
    showTip(px, Math.min(...series.map(s => y(s.values[i].v))), `<div class="when">${longDate(pts[i].t)}</div>` +
      rows.map(r => `<div class="row"><span class="sw" style="background:${r.s.color}"></span>${esc(r.s.label)}<b>${fmt(r.v)}</b>${i ? `<s>${r.ch ? signed(r.ch) : ""}</s>` : ""}</div>`).join(""), W, H);
  };
  svg.onpointerleave = () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); dots.forEach(d => d.setAttribute("visibility", "hidden")); };
}

function drawBars(pts, W, H, L, R, T, B) {
  // Hourly buckets for short ranges, daily otherwise (local time)
  const hourly = state.range && state.range <= 2;
  const unit = hourly ? HOUR : DAY;
  const floor = t => { const d = new Date(t); hourly ? d.setMinutes(0, 0, 0) : d.setHours(0, 0, 0, 0); return +d; };
  const next = t => { const d = new Date(t); hourly ? d.setHours(d.getHours() + 1) : d.setDate(d.getDate() + 1); return +d; };
  const r = state.focus, buckets = [];
  for (let b = floor(Math.max(pts[0].t, first.t)); b <= latest.t; b = next(b)) {
    const end = Math.min(next(b), latest.t + 1), startSnap = at(b - 1), endSnap = at(end - 1);
    buckets.push({ t: b, end, v: Math.max(0, val(endSnap, r) - val(startSnap, r)), partial: next(b) > latest.t });
  }
  const sc = niceScale(0, Math.max(...buckets.map(b => b.v), 1));
  sc.lo = 0;
  // Cap bar width so a few days don't become slabs; center the group
  const bw = Math.min((W - L - R) / buckets.length, 72), gap = Math.min(bw * .3, 18), X0 = L + (W - L - R - bw * buckets.length) / 2;
  const y = v => T + (1 - v / sc.hi) * (H - T - B);
  for (let v = 0; v <= sc.hi + 1e-9; v += sc.step) {
    el("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: "var(--grid)" });
    el("text", { x: L - 8, y: y(v) + 4, "text-anchor": "end", class: "axis" }).textContent = fmt(v);
  }
  const every = Math.ceil(buckets.length / 7);
  buckets.forEach((b, i) => { if ((buckets.length - 1 - i) % every) return;
    el("text", { x: X0 + bw * (i + .5), y: H - 6, "text-anchor": "middle", class: "axis" }).textContent =
      hourly ? new Date(b.t).toLocaleTimeString([], { hour: "numeric" }) : new Date(b.t).toLocaleDateString([], { month: "short", day: "numeric" }); });
  const fill = r ? color(r) : "var(--accent)";
  const rects = buckets.map((b, i) => {
    const h = Math.max(y(0) - y(b.v), b.v ? 2 : 0), rx = Math.min(4, (bw - gap) / 2);
    const bx = X0 + bw * i + gap / 2, by = y(0) - h, w = bw - gap;
    // rounded top, square base
    const d = h ? `M${bx},${y(0)}V${by + rx}Q${bx},${by} ${bx + rx},${by}H${bx + w - rx}Q${bx + w},${by} ${bx + w},${by + rx}V${y(0)}Z` : "";
    return el("path", { d, fill, opacity: b.partial ? .55 : 1 });
  });
  $("chart-title").textContent = `Downloads gained per ${hourly ? "hour" : "day"}`;
  hover = mx => {
    const i = Math.max(0, Math.min(buckets.length - 1, Math.floor((mx - X0) / bw))), b = buckets[i];
    rects.forEach((p, k) => p.style.opacity = k === i ? 1 : (buckets[k].partial ? .3 : .45));
    const when = hourly ? `${new Date(b.t).toLocaleString([], { weekday: "short", hour: "numeric" })}`
                        : new Date(b.t).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
    showTip(X0 + bw * (i + .5), y(b.v), `<div class="when">${when}${b.partial ? " · so far" : ""}</div>` +
      `<div class="row"><span class="sw" style="background:${fill}"></span>${esc(r || "All repos")}<b>+${fmt(b.v)}</b></div>`, W, H);
  };
  svg.onpointerleave = () => { tip.style.display = "none"; rects.forEach((p, k) => p.style.opacity = buckets[k].partial ? .55 : 1); };
}

function showTip(px, py, html, W, H) {
  tip.innerHTML = html; tip.style.display = "block";
  const r = svg.getBoundingClientRect(), sx = r.width / W, sy = r.height / H;
  let left = px * sx + 14;
  if (left + tip.offsetWidth > box.clientWidth) left = px * sx - tip.offsetWidth - 14;
  tip.style.left = Math.max(0, left) + "px";
  tip.style.top = Math.max(0, Math.min(py * sy - tip.offsetHeight / 2, r.height - tip.offsetHeight)) + "px";
}
svg.onpointermove = e => { if (!hover) return; const r = svg.getBoundingClientRect(); hover((e.clientX - r.left) * svg.viewBox.baseVal.width / r.width); };
svg.onpointerdown = svg.onpointermove;

function renderLegend() {
  const lg = $("legend");
  lg.replaceChildren();
  if (state.view !== "repos") return;
  for (const s of seriesFor("repos", [latest])) {
    const b = document.createElement("button");
    b.setAttribute("aria-pressed", String(!state.hidden.has(s.key)));
    b.innerHTML = `<span class="sw" style="background:${s.color}"></span>`;
    b.append(s.label);
    b.title = "Click to show/hide · double-click to show only this";
    b.onclick = () => { state.hidden.has(s.key) ? state.hidden.delete(s.key) : state.hidden.add(s.key); draw(); };
    b.ondblclick = () => { state.hidden = new Set(seriesFor("repos", [latest]).map(x => x.key).filter(k => k !== s.key)); draw(); };
    lg.append(b);
  }
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---- repo cards ----
function spark(r) {
  const pts = snaps.filter(s => s.t >= latest.t - 7 * DAY), vs = pts.map(s => val(s, r));
  if (vs.length < 2) return "";
  const lo = Math.min(...vs), hi = Math.max(...vs, lo + 1), t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const d = pts.map((s, i) => (i ? "L" : "M") + ((s.t - t0) / Math.max(t1 - t0, 1) * 106 + 2).toFixed(1) + "," + (30 - (vs[i] - lo) / (hi - lo) * 26).toFixed(1)).join("");
  return `<svg class="spark" viewBox="0 0 110 34" aria-hidden="true"><path d="${d}" fill="none" stroke="${color(r)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function releases(r) {
  const by = {};
  for (const a of ASSETS.filter(a => a.repo === r)) {
    const k = a.release, n = (+a.last) + (+a.banked);
    (by[k] ||= { tag: k, n: 0, files: [] }).n += n;
    by[k].files.push(`${a.name} (${fmt(n)})`);
  }
  return Object.values(by).sort((a, b) => b.n - a.n);
}
function renderRepos() {
  const span = state.range ? state.range * DAY : latest.t - first.t;
  const label = state.range ? { 1: "24h", 7: "7d", 30: "30d" }[state.range] : "all time";
  let list = repos.filter(r => r.toLowerCase().includes(state.q)).map(r => ({ r, n: val(latest, r), g: gainSince(span, r) }));
  list.sort(state.sort === "name" ? (a, b) => a.r.localeCompare(b.r) : state.sort === "day" ? (a, b) => b.g - a.g || b.n - a.n : (a, b) => b.n - a.n);
  const wrap = $("repos");
  wrap.replaceChildren();
  if (!list.length) { wrap.innerHTML = `<div class="empty">No repos match “${esc(state.q)}”</div>`; return; }
  for (const { r, n, g } of list) {
    const card = document.createElement("article");
    card.className = "repo" + (state.open === r ? " open" : "");
    const share = total ? n / total * 100 : 0;
    card.innerHTML = `
      <button aria-expanded="${state.open === r}">
        <div class="top"><span class="sw" style="background:${color(r)}"></span><span class="name">${esc(r)}</span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></div>
        <div class="mid"><span class="total num">${fmt(n)}</span><span class="badge num ${g > 0 ? "up" : ""}" title="Gained in the last ${label}">${signed(g)} · ${label}</span>${spark(r)}</div>
        <div class="bar"><i style="width:${share}%;background:${color(r)}"></i></div>
        <div class="share"><span>${share.toFixed(1)}% of all downloads</span><span>${releases(r).length} releases</span></div>
      </button>
      <div class="detail">
        <div class="detail-actions">
          <button class="btn" data-act="focus">Show in chart</button>
          <a class="btn" href="https://github.com/${USER}/${encodeURIComponent(r)}/releases" target="_blank" rel="noopener">Releases on GitHub ↗</a>
        </div>
        <table><thead><tr><th>Release</th><th>Downloads</th><th>Share</th></tr></thead><tbody>
        ${releases(r).map(x => `<tr><td>${esc(x.tag)}<div class="files">${esc(x.files.join(" · "))}</div></td><td class="num">${fmt(x.n)}</td><td class="num">${n ? (x.n / n * 100).toFixed(0) : 0}%</td></tr>`).join("")}
        </tbody></table>
        <div class="note">Includes downloads of files that were since deleted or re-uploaded.</div>
      </div>`;
    card.querySelector("button").onclick = () => { state.open = state.open === r ? null : r; renderRepos(); };
    card.querySelector("[data-act=focus]").onclick = () => { setFocus(r); $("chart").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" }); };
    wrap.append(card);
  }
}

draw();
renderRepos();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(draw, 100); });
</script>
</body>
</html>
